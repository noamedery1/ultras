<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1B0B2E">
<title>תהל — הדרך לפסגה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#170826; --stage:#2E1049; --velvet:#3F1663;
  --pink:#FF3D8B; --gold:#FFC93C; --mint:#3FE0BE; --cream:#FFF1E4;
  --dim:rgba(255,241,228,.62); --line:rgba(255,241,228,.14);
  --disp:'Secular One',system-ui,sans-serif; --body:'Assistant',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0E0518}
body{font-family:var(--body);color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:#170826;overflow:hidden}
.hidden{display:none !important}

/* ---------------- HUD ---------------- */
#hud{position:relative;z-index:20;flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(14,5,24,.94),rgba(14,5,24,.55));backdrop-filter:blur(8px)}
#hud.hide{display:none}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat b{font-family:var(--disp);font-size:17px;line-height:1}
.stat span{font-size:10px;color:var(--dim);letter-spacing:.4px}
.stat.grow{flex:1}
#scr{letter-spacing:-2px;font-size:16px}
.bar{height:7px;border-radius:99px;background:rgba(255,241,228,.13);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar.low i{background:linear-gradient(90deg,var(--pink),#FF7A3D)}
#lvchip{font-family:var(--disp);font-size:11px;padding:5px 10px;border-radius:99px;
  background:rgba(255,61,139,.18);border:1px solid rgba(255,61,139,.45);color:#FFB9D4;white-space:nowrap}

/* ---------------- the room (persistent layer) ---------------- */
#stagewrap{position:relative;z-index:4;flex:1 1 auto;min-height:0}
#room{position:absolute;inset:0;overflow:hidden;z-index:0;background:#241038;
  animation:roomin 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes roomin{from{transform:scale(1.09);opacity:.15;filter:blur(6px)}
  to{transform:none;opacity:1;filter:none}}
.p{position:absolute}
#floor{position:absolute;left:0;right:0;bottom:0;height:34%}
#spot{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:screen;
  background:radial-gradient(closest-side at var(--sx,50%) var(--sy,62%),rgba(255,201,60,.22) 0%,rgba(255,61,139,.10) 45%,transparent 74%);
  transition:background .6s ease}
#vig{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(130% 90% at 50% 45%,transparent 40%,rgba(8,2,16,.72) 100%)}
#dust{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.mote{position:absolute;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,241,228,.7),rgba(255,201,60,.15),transparent);
  animation:drift linear infinite}
@keyframes drift{0%{transform:translate3d(0,30px,0) scale(.7);opacity:0}
  18%{opacity:.75}82%{opacity:.5}
  100%{transform:translate3d(var(--dx,14px),-150px,0) scale(1.15);opacity:0}}
#grain{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.045;
  background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent .5px);background-size:3px 3px}

/* ---------------- characters standing in the room ---------------- */
#cast{position:absolute;inset:0;z-index:6;pointer-events:none}
.ch{position:absolute;left:var(--x);bottom:var(--fy,15%);transform:translateX(-50%);
  animation:chin .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:var(--in,0s);
  transform-origin:bottom center;transition:filter .3s ease,opacity .3s ease;
  animation:chin .6s cubic-bezier(.2,1.05,.3,1) both;animation-delay:var(--in,0s)}
@keyframes camin{from{opacity:0;transform:translateX(-50%) translateY(60px) rotate(-6deg)}
  60%{transform:translateX(-50%) translateY(-8px) rotate(2deg)}
  to{opacity:1;transform:translateX(-50%)}}
@keyframes chin{from{opacity:0;transform:translateX(-50%) translateY(30px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}}
.fig{position:relative;display:flex;flex-direction:column;align-items:center;
  animation:bob 3.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes camin{from{opacity:0;transform:translateX(-50%) translateY(60px) rotate(-6deg)}
  60%{transform:translateX(-50%) translateY(-8px) rotate(2deg)}
  to{opacity:1;transform:translateX(-50%)}}
@keyframes chin{from{opacity:0;transform:translateX(-50%) translateY(22px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* real cut-out people */
.cut{height:calc(160px * var(--s,1));width:auto;display:block;pointer-events:none;
  filter:drop-shadow(0 16px 14px rgba(0,0,0,.45));transition:filter .25s ease}
.shadow{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  width:calc(58px * var(--s,1));height:calc(13px * var(--s,1));border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.65),rgba(0,0,0,0))}
.ch.talk .cut{filter:drop-shadow(0 0 13px rgba(255,201,60,.8)) drop-shadow(0 16px 14px rgba(0,0,0,.45))}
.head{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:27px;background:#3A1A55;border:3px solid var(--col,#FFC93C);overflow:hidden;z-index:2;
  box-shadow:0 4px 14px rgba(0,0,0,.5)}
.head img{width:100%;height:100%;object-fit:cover;display:block}
.torso{width:56px;height:58px;margin-top:-7px;border-radius:26px 26px 10px 10px;position:relative;
  background:linear-gradient(170deg,var(--col,#FFC93C),color-mix(in srgb,var(--col,#FFC93C) 55%,#1B0B2E));
  box-shadow:0 8px 18px rgba(0,0,0,.45)}
.torso::before,.torso::after{content:'';position:absolute;top:12px;width:12px;height:34px;border-radius:8px;
  background:inherit;filter:brightness(.86)}
.torso::before{right:-8px;transform:rotate(6deg)}
.torso::after{left:-8px;transform:rotate(-6deg)}
.ch .nametag{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;
  font-family:var(--disp);font-size:10.5px;color:var(--dim);white-space:nowrap;letter-spacing:.3px}
#cast.live .ch{filter:brightness(.5) saturate(.55)}
#cast.live .ch.talk{filter:none}
.ch.talk .fig{animation:talkbob .46s ease-in-out infinite alternate}
@keyframes talkbob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.ch.cameo{animation:camin .45s cubic-bezier(.2,1.25,.35,1) both;z-index:8}
.ch.talk .head{box-shadow:0 0 0 4px rgba(255,201,60,.28),0 6px 20px rgba(0,0,0,.5)}

/* ---------------- speech bubble above the head ---------------- */
.bub{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);
  width:max-content;max-width:min(74vw,300px);
  background:var(--cream);color:#1B0B2E;border-radius:16px;padding:10px 13px;
  font-size:15px;font-weight:600;line-height:1.42;text-align:center;
  box-shadow:0 10px 28px rgba(0,0,0,.55);pointer-events:none;
  animation:bubin .26s cubic-bezier(.2,1.4,.4,1) both;z-index:9}
.bub .nm{display:block;font-family:var(--disp);font-size:10.5px;color:var(--pink);margin-bottom:3px;font-weight:400}
.bub::after{content:'';position:absolute;top:100%;left:var(--tx,50%);transform:translateX(-50%);
  border:9px solid transparent;border-top-color:var(--cream);border-bottom:0}
.ch[data-me] .bub{background:linear-gradient(160deg,#FF4E97,#C7267A);color:#fff}
.ch[data-me] .bub .nm{color:#FFD7E7}
.ch[data-me] .bub::after{border-top-color:#D62E85}
@keyframes bubin{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

/* ---------------- screens ---------------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:14px;z-index:10}
.screen.on{display:flex;animation:scrin .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes scrin{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
#dlg.on{animation:fade .3s ease both}
#title,#card,#res{animation:fade .35s ease both;background:rgba(14,5,24,.55);backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
#dlg{background:transparent;pointer-events:auto;justify-content:flex-end}

/* title */
#title{justify-content:center;align-items:center;text-align:center;gap:2px}
#rev{margin-top:14px;min-height:34px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;color:var(--dim);max-width:20em;line-height:1.45}
#rev span{animation:revin .5s ease both}
@keyframes revin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mic{font-size:66px;filter:drop-shadow(0 8px 30px rgba(255,61,139,.6));animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);margin-top:8px}
h1{font-family:var(--disp);font-size:clamp(36px,12.5vw,56px);margin:2px 0 0;line-height:.98;
  background:linear-gradient(180deg,#FFF1E4 30%,var(--pink) 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:15px;color:var(--dim);max-width:20em;margin:10px 0 4px;line-height:1.5}
/* buttons */
.btn{font-family:var(--disp);font-size:18px;color:#2A0A18;background:linear-gradient(180deg,var(--gold),#FF9E2C);
  border:0;border-radius:16px;padding:15px 30px;margin-top:14px;
  box-shadow:0 8px 0 #B4691A,0 14px 26px rgba(0,0,0,.45);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #B4691A,0 8px 14px rgba(0,0,0,.4)}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line);box-shadow:none;font-size:15px;padding:11px 20px}
.btn.ghost:active{transform:scale(.97);background:rgba(255,241,228,.07)}
.btn:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
/* level card */
#card{justify-content:center;align-items:center;text-align:center}
.num{font-family:var(--disp);font-size:13px;color:var(--pink);letter-spacing:2px}
.cardtitle{font-family:var(--disp);font-size:34px;margin:8px 0 6px;line-height:1.05}
.cardscene{font-size:60px;margin:8px 0;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.cardsub{font-size:15px;color:var(--dim);max-width:22em;line-height:1.55}
/* choices */
#choices{display:flex;flex-direction:column;gap:8px;padding-bottom:calc(env(safe-area-inset-bottom) + 4px);z-index:12}
.choice{text-align:right;font-family:var(--body);font-weight:600;font-size:15px;
  background:linear-gradient(180deg,rgba(52,24,80,.9),rgba(23,8,38,.9));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 8px 20px rgba(0,0,0,.4);border:1.5px solid var(--line);color:var(--cream);backdrop-filter:blur(6px);
  border-radius:14px;padding:13px 15px;cursor:pointer;line-height:1.4;transition:transform .08s,background .15s,border-color .15s}
.choice:active{transform:scale(.98)}
.choice:hover{background:rgba(255,61,139,.22);border-color:rgba(255,61,139,.55)}
.choice:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.chq{font-family:var(--disp);font-size:16px;color:var(--gold);text-align:center;
  padding:4px 0 2px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#tapon{font-size:12px;color:var(--cream);text-align:center;padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);
  text-shadow:0 2px 8px #000;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
/* minigame */
#game{padding:10px;background:rgba(14,5,24,.62);backdrop-filter:blur(2px)}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.gtitle{font-family:var(--disp);font-size:19px}
.gtimer{font-family:var(--disp);font-size:15px;color:var(--gold)}
.gbarwrap{margin-bottom:8px}
#gbox.danger{box-shadow:inset 0 0 0 3px rgba(255,61,139,.5);border-radius:20px}
#gbox{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-bottom:calc(env(safe-area-inset-bottom) + 2px)}
#gbox canvas{width:100%;height:100%;border-radius:18px;background:rgba(0,0,0,.32);border:1px solid var(--line);display:block;touch-action:none}
#ghint{font-size:12.5px;color:var(--dim);text-align:center;margin-top:6px;line-height:1.4}
/* puzzle */
.pz{display:grid;direction:ltr;grid-template-columns:repeat(3,1fr);gap:6px;width:min(90%,320px);aspect-ratio:1}
.pz b{border-radius:13px;background:#3A1A55 no-repeat;background-size:300% 300%;display:flex;align-items:center;justify-content:center;
  font-size:30px;cursor:pointer;border:2.5px solid transparent;transition:transform .12s,border-color .12s;
  box-shadow:0 4px 12px rgba(0,0,0,.35)}
.pz b.sel{border-color:var(--gold);transform:scale(.92)}
.pz b.ok{border-color:rgba(63,224,190,.55)}
.pzref{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim)}
.pzref span{width:80px;height:80px;border-radius:10px;border:2px solid rgba(255,201,60,.55);
  background:center/cover;display:block;box-shadow:0 6px 16px rgba(0,0,0,.45)}
/* simon */
.sim{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(84%,300px);aspect-ratio:1}
.sim b{border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:38px;
  opacity:.42;cursor:pointer;transition:opacity .12s,transform .12s;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.sim b.lit{opacity:1;transform:scale(1.06)}
.simsay{font-family:var(--disp);font-size:16px;color:var(--gold);min-height:22px}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:min(96%,340px)}
.mem b{aspect-ratio:.8;perspective:760px;background:none;border:0;padding:0;cursor:pointer;
  transition:transform .14s ease}
.mem b:active{transform:scale(.95)}
.mem .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .44s cubic-bezier(.2,.85,.25,1)}
.mem b.up .in,.mem b.done .in{transform:rotateY(180deg)}
.mem .s{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:13px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mem .back{background:linear-gradient(155deg,#6C36A4 0%,#3A1A5E 55%,#25123E 100%);
  border:1.5px solid rgba(255,241,228,.2);font-size:22px;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 6px 14px rgba(0,0,0,.4)}
.mem .front{transform:rotateY(180deg);background:#F3E4D0;border:2px solid rgba(255,201,60,.6);
  box-shadow:0 6px 16px rgba(0,0,0,.45)}
.mem .front img{width:100%;height:100%;object-fit:cover;display:block}
.mem b.done .front{border-color:var(--mint);box-shadow:0 0 18px rgba(63,224,190,.5)}
/* ---- אל תעירו את אבא ---- */
.slp{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.slpface{position:relative;width:150px;height:150px;border-radius:50%;overflow:hidden;
  border:3px solid rgba(255,241,228,.25);box-shadow:0 12px 30px rgba(0,0,0,.55);
  transition:transform .25s ease,border-color .25s ease;transform:rotate(-8deg) scale(.96)}
.slpface img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.75) saturate(.8)}
.slpface.awake{transform:rotate(0deg) scale(1.06);border-color:var(--pink)}
.slpface.awake img{filter:none}
.slpface.shake{animation:shk .38s ease}
@keyframes shk{0%,100%{transform:rotate(0) scale(1.06)}25%{transform:rotate(6deg) scale(1.08)}75%{transform:rotate(-6deg) scale(1.08)}}
.zzz{position:absolute;top:6px;right:10px;font-size:26px;transition:opacity .3s;animation:zzf 2.4s ease-in-out infinite}
@keyframes zzf{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-10px);opacity:1}}
.slpstate{font-family:var(--disp);font-size:23px;padding:9px 20px;border-radius:99px;transition:all .18s}
.slpstate.ok{background:rgba(63,224,190,.16);color:var(--mint);border:1px solid rgba(63,224,190,.4)}
.slpstate.warn{background:rgba(255,201,60,.18);color:var(--gold);border:1px solid rgba(255,201,60,.5)}
.slpstate.bad{background:rgba(255,61,139,.2);color:#FF9AC2;border:1px solid rgba(255,61,139,.55)}
.slphold{width:min(94%,330px);touch-action:none;-webkit-user-select:none;text-align:center;
  font-family:var(--disp);font-size:23px;color:#2A0A18;display:flex;flex-direction:column;gap:2px;
  animation:pulseb 1.6s ease-in-out infinite;
  background:linear-gradient(180deg,var(--gold),#FF9E2C);border-radius:18px;padding:18px;
  box-shadow:0 8px 0 #B4691A,0 14px 26px rgba(0,0,0,.45);user-select:none;cursor:pointer;transition:transform .07s}
.slphold small{font-family:var(--body);font-size:12.5px;font-weight:700;opacity:.72}
.slphold.on{animation:none;transform:translateY(5px);box-shadow:0 3px 0 #1E9C82;
  background:linear-gradient(180deg,#7BF0D6,var(--mint))}
@keyframes pulseb{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.slpname{font-size:12.5px;color:var(--dim);margin-top:-4px}
.vu{position:relative;width:min(94%,340px);height:38px;border-radius:12px;overflow:hidden;
  background:rgba(0,0,0,.42);border:1.5px solid var(--line);box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.vu i{display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--mint),var(--gold) 60%,var(--pink));transition:width .1s linear}
.vu::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(12,4,22,.9) 13px 17px)}
.vu b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:16px;color:#fff;text-shadow:0 2px 7px rgba(0,0,0,.9);z-index:2}
/* ---- מסך הסבר לפני כל משחק ---- */
.howto{position:absolute;inset:0;z-index:18;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:24px;text-align:center;
  background:rgba(11,4,20,.93);backdrop-filter:blur(9px);animation:fade .28s ease both}
.howto .hi{font-size:58px;filter:drop-shadow(0 10px 26px rgba(255,61,139,.5))}
.howto h3{font-family:var(--disp);font-size:31px;margin:2px 0 0}
.howto p{font-size:18px;font-weight:700;line-height:1.5;color:var(--cream);max-width:17em;margin:0}
.skipbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 8px);
  z-index:19;font-size:13px;padding:9px 16px;background:rgba(11,4,20,.85);animation:fade .4s ease both}
.howto .tips{display:flex;flex-direction:column;gap:8px;width:min(94%,340px);margin-top:8px}
.howto .tips span{display:flex;align-items:center;gap:10px;text-align:right;
  font-size:16px;font-weight:600;line-height:1.4;color:var(--cream);
  background:linear-gradient(180deg,rgba(62,30,94,.85),rgba(28,11,46,.85));
  border:1.5px solid rgba(255,241,228,.16);border-radius:14px;padding:12px 14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.howto .tips b{color:var(--gold);font-weight:800}
/* ---- איפה תהל? ---- */
.find{position:relative;width:100%;flex:1;min-height:240px;border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0,rgba(255,61,139,.12),rgba(0,0,0,.3));border:1px solid var(--line)}
.fface{position:absolute;padding:0;border:2px solid rgba(255,241,228,.3);border-radius:50%;overflow:hidden;
  background:#3A1A55;cursor:pointer;transition:transform .12s;font-size:20px;line-height:1}
.fface img{width:100%;height:100%;object-fit:cover;display:block}
.fface:active{transform:scale(.9)}
.fface.found{border-color:var(--mint);box-shadow:0 0 0 4px rgba(63,224,190,.5);transform:scale(1.25);z-index:3}
.fface.nope{border-color:var(--pink);opacity:.35}
/* ---- תעירי את הקהל ---- */
.whack{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(96%,340px)}
.hole{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.5) 55%,#3A1F52 55%,#25133A 100%);border:1px solid var(--line)}
.hole::after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:26%;border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,#4E2A6E,#2A1442);box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.pop{position:absolute;left:8%;bottom:-100%;width:84%;height:84%;padding:0;border:0;background:none;
  cursor:pointer;transition:bottom .17s cubic-bezier(.2,1.2,.4,1)}
.hole.up .pop{bottom:22%}
.pop{z-index:2}
.pf{position:relative;display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;
  border:2.5px solid rgba(255,241,228,.35);background:#3A1A55;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.pf img{width:100%;height:100%;object-fit:cover;display:block}
.pf .zz{position:absolute;top:-6px;left:-4px;font-size:17px;font-style:normal}
.hole.woke{box-shadow:inset 0 0 0 2px var(--mint)}
/* ---- מי אמר את זה? ---- */
.who{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center}
.quote{width:min(94%,340px);min-height:92px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:17px;font-weight:600;line-height:1.45;color:#1B0B2E;
  background:var(--cream);border-radius:18px;padding:16px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.quote.yes{background:linear-gradient(160deg,#8CF0D8,#3FE0BE);font-family:var(--disp)}
.quote.no{background:linear-gradient(160deg,#FFA8C8,#FF6FA0);color:#fff;font-family:var(--disp)}
.whorow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(99%,350px)}
.wface{padding:6px 1px;border:2px solid var(--line);border-radius:14px;background:rgba(255,241,228,.06);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .1s,border-color .2s}
.wface img{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block}
.wface span{font-size:10px;color:var(--cream);font-family:var(--disp)}
.wface:active{transform:scale(.94)}
.wface.yes{border-color:var(--mint);box-shadow:0 0 16px rgba(63,224,190,.45)}
.wface.no{border-color:var(--pink);opacity:.5}
/* result */
#res{justify-content:center;align-items:center;text-align:center}
.resicon{font-size:66px;margin-bottom:4px}
.restitle{font-family:var(--disp);font-size:29px;margin:4px 0}
.restext{font-size:15px;color:var(--dim);max-width:21em;line-height:1.55;margin-top:4px}
.gain{font-family:var(--disp);font-size:22px;color:var(--mint);margin-top:12px}
.gain.bad{color:var(--pink)}
/* finale */
#fin{overflow-y:auto;align-items:center;text-align:center;justify-content:flex-start;background:rgba(14,5,24,.8)}
.cert{width:100%;background:linear-gradient(165deg,#FFF6EC,#FFE3CF);color:#2A0A18;border-radius:22px;padding:20px 16px;margin-top:6px;
  border:3px solid var(--gold);box-shadow:0 18px 50px rgba(0,0,0,.55)}
.bigmazal{font-family:var(--disp);font-size:clamp(34px,11vw,48px);margin:2px 0 10px;line-height:1;
  background:linear-gradient(180deg,#FFF1E4 25%,var(--gold) 70%,var(--pink) 120%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 22px rgba(255,61,139,.45));animation:mazal .8s cubic-bezier(.2,1.4,.3,1) both}
@keyframes mazal{0%{opacity:0;transform:scale(.6) rotate(-4deg)}60%{transform:scale(1.08)}100%{opacity:1;transform:none}}
.cert h2{font-family:var(--disp);font-size:26px;margin:6px 0 2px;color:#B4126A}
.cert .big{font-family:var(--disp);font-size:46px;margin:6px 0;color:#2A0A18}
.cert .lbl{font-size:11px;letter-spacing:2px;color:#8A5A2B}
.wish{background:rgba(255,61,139,.09);border-right:3px solid var(--pink);border-radius:10px;padding:9px 11px;margin:7px 0;text-align:right;font-size:14px;line-height:1.5}
.wish b{color:#B4126A;font-family:var(--disp);font-weight:400}
#conf{position:absolute;inset:0;pointer-events:none;z-index:30}
/* live comments + popups */
#live{position:absolute;left:10px;bottom:74px;width:min(56%,215px);height:150px;z-index:14;
  pointer-events:none;display:flex;flex-direction:column-reverse;gap:6px;overflow:hidden}
.cmt{display:flex;align-items:center;gap:7px;flex:0 0 auto;
  background:rgba(20,7,34,.68);border:1px solid rgba(255,241,228,.15);border-radius:99px;
  padding:3px 11px 3px 3px;font-size:12.5px;font-weight:600;color:var(--cream);
  backdrop-filter:blur(4px);animation:cmtin .38s ease both,cmtout .6s ease 2.9s both}
.cmt i{width:23px;height:23px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:#3A1A55;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-style:normal}
.cmt i img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes cmtin{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes cmtout{to{opacity:0;transform:translateY(-12px)}}
#pop{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:16;pointer-events:none;
  font-family:var(--disp);font-size:clamp(24px,7.5vw,34px);color:var(--gold);
  text-shadow:0 4px 20px rgba(0,0,0,.85),0 0 30px rgba(255,201,60,.4)}
.popfx{animation:popfx 1s cubic-bezier(.2,1.4,.3,1) both}
@keyframes popfx{0%{opacity:0;transform:scale(.55)}22%{opacity:1;transform:scale(1.14)}
  70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05) translateY(-18px)}}
/* --- juice: toasts + floating crowd reactions --- */
#toast{position:absolute;left:0;right:0;top:34%;z-index:26;display:flex;flex-direction:column;
  align-items:center;gap:7px;pointer-events:none}
.toast{font-family:var(--disp);font-size:19px;padding:8px 18px;border-radius:99px;color:#2A0A18;white-space:nowrap;
  background:linear-gradient(180deg,var(--gold),#FF9E2C);box-shadow:0 10px 30px rgba(0,0,0,.55);
  animation:toastin .26s cubic-bezier(.2,1.5,.4,1) both, toastout .45s ease 1s forwards}
.toast.pink{background:linear-gradient(180deg,#FF6FA8,#D62E85);color:#fff}
.toast.mint{background:linear-gradient(180deg,#6DF0D4,#25B79B);color:#06322A}
@keyframes toastin{from{opacity:0;transform:translateY(20px) scale(.82)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-26px) scale(.94)}}
#react{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.rx{position:absolute;bottom:-36px;opacity:.9;animation:rise linear forwards;will-change:transform}
@keyframes rise{to{transform:translateY(-115vh) translateX(var(--dx,0)) rotate(var(--rz,0deg));opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

<script>
/* ===================== ENGINE ===================== */
const $ = id => document.getElementById(id);
const S = { fol:0, scr:3, pat:100, lv:0, retry:false };
let curLevel = null;

/* ---------- sound ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f, d=.12, type='sine', v=.16, slide=0){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide), a.currentTime+d);
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(v,a.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d+.02);
}
const sfx = {
  tap:()=>tone(660,.07,'triangle',.12),
  good:()=>{tone(784,.1,'triangle',.16);setTimeout(()=>tone(1046,.14,'triangle',.14),70)},
  bad:()=>tone(180,.22,'sawtooth',.1,-90),
  win:()=>[0,120,240,400].forEach((d,i)=>setTimeout(()=>tone([523,659,784,1046][i],.3,'triangle',.17),d)),
  lose:()=>[0,140,300].forEach((d,i)=>setTimeout(()=>tone([392,330,262][i],.3,'sine',.14),d))
};

/* ---------- screens ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id));
}
function hud(on){ $('hud').classList.toggle('hide', !on); }
function paint(){
  $('fol').textContent = S.fol >= 1000 ? (S.fol/1000).toFixed(S.fol>=10000?0:1).replace('.0','')+'K' : S.fol;
  $('scr').textContent = '🎀'.repeat(Math.max(0,S.scr)) || '—';
  const b=$('patbar'); b.querySelector('i').style.width = Math.max(0,Math.min(100,S.pat))+'%';
  b.classList.toggle('low', S.pat<40);
  $('lvchip').textContent = 'שלב ' + Math.min(5, S.lv+1);
}
const MILES=[1000,5000,10000,25000,50000,100000], milesHit=[];
function addFol(n){
  const from=S.fol; S.fol+=n; const t0=performance.now();
  MILES.forEach(m=>{ if(S.fol>=m && milesHit.indexOf(m)<0){ milesHit.push(m);
    setTimeout(()=>{ toast('🎉 '+m.toLocaleString('en')+' עוקבים!','mint'); sfx.good(); burst(36); },380); } });
  (function step(t){ const k=Math.min(1,(t-t0)/700); S.fol=Math.round(from+n*k); paint(); if(k<1) requestAnimationFrame(step); })(t0);
}
function spot(pos){ $('spot').style.setProperty('--sx',pos.split(' ')[0]); $('spot').style.setProperty('--sy',pos.split(' ')[1]); }

/* ---------- room + cast ---------- */
function buildRoom(n){
  const R=ROOMS[n]||ROOMS[0];
  const rm=$('room');
  rm.style.background=R.bg;
  rm.innerHTML=R.html;
  $('fg').innerHTML=R.fg||'';
  rm.style.animation='none'; void rm.offsetWidth; rm.style.animation='';
}
function buildCast(n){
  const cast=$('cast'); cast.innerHTML=''; cast.classList.remove('live');
  ((LEVELS[n]&&LEVELS[n].cast)||[]).forEach((c,i)=>{
    const ch=C[c.k]; if(!ch) return;
    const d=document.createElement('div');
    d.className='ch'; d.dataset.k=c.k; d.dataset.s=c.s||1;
    if(c.k==='tahel') d.dataset.me='1';
    d.style.setProperty('--x',c.x+'%');
    d.style.setProperty('--fy',(c.fy||15)+'%');
    d.style.setProperty('--s',c.s||1);
    d.style.setProperty('--col',ch.col||'#FFC93C');
    d.style.setProperty('--in',(i*0.09).toFixed(2)+'s');
    d.style.setProperty('--in',(i*0.09).toFixed(2)+'s');
    const body = ch.cut
      ? '<div class="shadow"></div><img class="cut" src="'+ch.cut+'" alt="'+ch.name+'">'
      : '<div class="head">'+(ch.photo?'<img src="'+ch.photo+'" alt="'+ch.name+'">':ch.emoji)+'</div><div class="torso"></div>';
    d.innerHTML='<div class="fig" style="--d:'+(i*0.45).toFixed(2)+'s">'+body+'</div>'+
      '<div class="nametag">'+ch.name+'</div>';
    cast.appendChild(d);
  });
}
function clearBubbles(){
  $('cast').querySelectorAll('.ch.cameo').forEach(e=>e.remove());
  $('cast').querySelectorAll('.bub').forEach(b=>b.remove());
  $('cast').querySelectorAll('.ch').forEach(c=>c.classList.remove('talk'));
  $('cast').classList.remove('live');
  $('choices').innerHTML='';
}

/* ---------- cameo: a character bursts into the scene for one line ---------- */
function cameo(k, text){
  const cast=$('cast'), ch=C[k];
  if(!ch) return say(k,text);
  cast.querySelectorAll('.ch.cameo').forEach(e=>e.remove());

/* ---------- a character speaks, above their head ---------- */
function say(k, text){
  const cast=$('cast'); cast.classList.add('live');
  cast.querySelectorAll('.ch.cameo').forEach(e=>{ if(e.dataset.k!==k) e.remove(); });
  cast.querySelectorAll('.bub').forEach(b=>b.remove());
  cast.querySelectorAll('.ch').forEach(c=>c.classList.remove('talk'));
  let ch=cast.querySelector('.ch[data-k="'+k+'"]') || cast.querySelector('.ch');
  if(!ch) return;
  ch.classList.add('talk');
  const b=document.createElement('div');
  b.className='bub';
  b.innerHTML='<span class="nm">'+((C[k]&&C[k].name)||'')+'</span>'+text;
  const fig=ch.querySelector('.fig');
  const sc=parseFloat(ch.dataset.s||1);
  const fh=fig.offsetHeight || Math.round(160*sc);
  b.style.bottom=Math.round((ch.querySelector('.cut')? fh : fh*sc)+14)+'px';
  ch.appendChild(b);
  requestAnimationFrame(()=>{
    const st=$('stagewrap').getBoundingClientRect(), r=b.getBoundingClientRect();
    let dx=0;
    if(r.left < st.left+10) dx=(st.left+10)-r.left;
    else if(r.right > st.right-10) dx=(st.right-10)-r.right;
    if(dx){ b.style.left='calc(50% + '+dx+'px)'; b.style.setProperty('--tx','calc(50% - '+dx+'px)'); }
  });
  sfx.tap();
}

let dlgTimer=null;
const dlgStop=()=>{ if(dlgTimer){ clearTimeout(dlgTimer); dlgTimer=null; } };
const readMs=t => Math.min(3100, 850 + t.length*48);
function runDialogue(list, done){
  show('dlg'); let i=0;
  dlgStop();
  $('tapon').textContent='הקישי לדלג ▸'; $('choices').innerHTML='';
  const step=()=>{
    dlgStop();
    if(i>=list.length){ $('tapon').style.display='none'; $('choices').innerHTML=''; return done(); }
    const n=list[i++];
    if(n.choose){
      $('tapon').style.display='none';
      $('choices').innerHTML='';
      const q=document.createElement('div');
      q.className='chq'; q.textContent=n.q||'👇 מה תהל תגיד?';
      $('choices').appendChild(q);
      n.choose.forEach(c=>{
        const b=document.createElement('button');
        b.className='choice'; b.textContent=c.t;
        b.onclick=ev=>{
          ev.stopPropagation();
          $('choices').innerHTML='';
          say('tahel', c.t);
          if(c.fx){ if(c.fx.fol) addFol(c.fx.fol); if(c.fx.pat) S.pat=Math.max(0,Math.min(100,S.pat+c.fx.pat)); paint(); }
          setTimeout(()=>{
            if(c.r){ say(c.r.w,c.r.t); $('tapon').style.display='block'; dlgStop(); dlgTimer=setTimeout(step, readMs(c.r.t)); }
            else step();
          }, 950);
        };
        $('choices').appendChild(b);
      });
      return;
    }
    (n.pop?cameo:say)(n.w,n.t);
    $('tapon').style.display='block';
    dlgTimer=setTimeout(step, readMs(n.t));
  };
  $('dlg').onclick=e=>{ if(e.target.closest('.choice')) return; if($('choices').children.length) return; step(); };
  step();
}

function gameSleep(cfg, done){
  const box=gsetup(cfg);
  box.innerHTML='<div class="slp">'+
    '<div class="slpface" id="slpf"><img src="'+(C.aba.photo||C.aba.cut)+'" alt="'+C.aba.name+'">'+
      '<span class="zzz" id="zzz">💤</span></div>'+
    '<div class="slpname">'+C.aba.name+' ישן על הספה</div>'+
    '<div class="slpstate" id="slps">😴 ישן</div>'+
    '<div class="vu"><i id="vuf"></i><b id="vuv">0%</b></div>'+
    '<div class="slphold" id="slph"></div></div>';
  const face=$('slpf'), st=$('slps'), hold=$('slph');
  let fill=0, caught=0, held=false, safe=true, live=true,
      t=performance.now(), t00=t, flip=t+2800, warned=false, grace=0;

  const sing=on=>{ held=on; hold.classList.toggle('on',on);
    hold.innerHTML = on ? '🎤 <b>שרה!</b><small>אל תשחררי</small>'
                        : '👇 <b>לחצי והחזיקי</b><small>כל עוד האצבע למטה — היא שרה</small>'; };
  sing(false);

  /* pointer capture: the release is delivered even if the finger slides off the button */
  const press=e=>{ if(e.cancelable) e.preventDefault();
    try{ hold.setPointerCapture(e.pointerId); }catch(_){}
    if(!held) sing(true); };
  const release=()=>{ if(held) sing(false); };
  if(window.PointerEvent){
    hold.addEventListener('pointerdown',press);
    hold.addEventListener('pointerup',release);
    hold.addEventListener('pointercancel',release);
    hold.addEventListener('lostpointercapture',release);
  } else {
    hold.addEventListener('touchstart',e=>{ e.preventDefault(); if(!held) sing(true); },{passive:false});
    hold.addEventListener('touchend',release);
    hold.addEventListener('touchcancel',release);
    hold.addEventListener('mousedown',e=>{ e.preventDefault(); if(!held) sing(true); });
  }
  window.addEventListener('mouseup',release);
  window.addEventListener('touchend',release);
  window.addEventListener('blur',release);

  const setState=()=>{
    st.textContent = safe ? '😴 ישן — שירי!' : '😳 מתעורר — שחררי!';
    st.className = 'slpstate '+(safe?'ok':'bad');
    face.classList.toggle('awake', !safe);
    $('zzz').style.opacity = safe?1:0;
    box.classList.toggle('danger', !safe);
  };
  setState();

  (function loop(now){
    if(!live) return;
    try{
      const dt=Math.min(60,now-t)/1000; t=now;
      if(now>flip){
        safe=!safe; warned=false; grace = safe?0:now+550; setState();
        flip = now + (safe ? 2400+Math.random()*2000 : 1300+Math.random()*700);
        tone(safe?300:170,.16,safe?'sine':'sawtooth',.09);
      }
      if(safe && !warned && flip-now<800){
        warned=true; st.textContent='😳 זהירות... הוא זז!'; st.className='slpstate warn'; tone(430,.09,'triangle',.12);
      }
      if(held){
        if(safe){ fill+=dt*22; if(Math.random()<.07) tone(520+Math.random()*300,.06,'sine',.05); }
        else if(now>grace){
          caught++; fill=Math.max(0,fill-18); sing(false);
          sfx.bad(); toast('אבא זז! 😳','pink');
          face.classList.add('shake'); setTimeout(()=>face.classList.remove('shake'),400);
        }
      }
      const left=(cfg.dur||48)-(now-t00)/1000;
      $('gtimer').textContent='⏱ '+Math.max(0,Math.ceil(left))+(caught?'  ·  😳 '+caught:'');
      prog(fill/100);
      $('vuf').style.width=Math.min(100,fill)+'%';
      $('vuv').textContent=Math.round(Math.min(100,fill))+'%';
      if(fill>=100){ live=false; release(); sfx.win(); return done(true); }
      if(left<=0){ live=false; release(); return done(fill>=70); }
    }catch(err){ console.error(err); }
    requestAnimationFrame(loop);
  })(t);
}

/* ============ 2 · איפה תהל? ============ */
function gameFind(cfg, done){
  const box=gsetup(cfg);
  const arena=document.createElement('div'); arena.className='find'; box.appendChild(arena);
  const others=['ima','aba','ach','achot'];
  const rounds=cfg.rounds||5;
  let r=0, hits=0, lives=3, live=true, timer=null;
  function round(){
    if(!live) return;
    if(r>=rounds){ live=false; sfx.win(); return done(hits>=rounds-1); }
    r++;
    prog((r-1)/rounds);
    $('gtimer').textContent='סבב '+r+'/'+rounds+'  ·  ❤ '+lives;
    arena.innerHTML='';
    const n = 7 + r*5;
    const W=arena.clientWidth||320, H=arena.clientHeight||300;
    const sz = Math.max(30, Math.min(56, Math.sqrt(W*H/(n*2.4))));
    const spots=[];
    for(let i=0;i<n;i++){
      let x,y,tries=0;
      do{ x=Math.random()*(W-sz); y=Math.random()*(H-sz); tries++; }
      while(tries<40 && spots.some(p=>Math.abs(p.x-x)<sz*.75 && Math.abs(p.y-y)<sz*.75));
      spots.push({x:x,y:y});
    }
    const target=(Math.random()*n)|0;
    spots.forEach((p,i)=>{
      const k = i===target ? 'tahel' : others[(Math.random()*others.length)|0];
      const el=document.createElement('button');
      el.className='fface'; el.style.cssText='left:'+p.x+'px;top:'+p.y+'px;width:'+sz+'px;height:'+sz+'px;'+
        'transform:rotate('+((Math.random()*24-12)|0)+'deg)';
      el.innerHTML = C[k].photo?'<img src="'+C[k].photo+'">':C[k].emoji;
      el.onclick=()=>{
        if(!live) return;
        clearTimeout(timer);
        try{
        if(i===target){ hits++; sfx.good(); addFol(220); el.classList.add('found');
          toast('מצאת! 🎯','mint'); burst(20); setTimeout(round,620); }
        else { lives--; sfx.bad(); el.classList.add('nope');
          if(lives<=0){ live=false; return done(false); }
          $('gtimer').textContent='סבב '+r+'/'+rounds+'  ·  ❤ '+lives; }
        }catch(err){ console.error(err); setTimeout(round,500); }
      };
      arena.appendChild(el);
    });
    timer=setTimeout(()=>{ if(!live) return; lives--; toast('נגמר הזמן ⏱','pink');
      if(lives<=0){ live=false; return done(false); } round(); }, 5200+r*600);
  }
  setTimeout(round,140);
}

  box.appendChild(grid);
  let open=[], found=0, moves=0, lock=false, streak=0, t0=performance.now(), live=true;
  deck.forEach((k,i)=>{
    const b=document.createElement('b'); b.dataset.k=k;
    b.innerHTML='<span class="in"><span class="s back">🎀</span><span class="s front">'+faceOf(k)+'</span></span>';
    b.onclick=()=>{
      if(lock||b.classList.contains('up')||b.classList.contains('done')) return;
      b.classList.add('up'); sfx.tap(); open.push(b);
      if(open.length===2){
        moves++; lock=true;
        const [a,c]=open;
        if(a.dataset.k===c.dataset.k){
          setTimeout(()=>{ a.classList.add('done'); c.classList.add('done'); a.classList.remove('up'); c.classList.remove('up');
            found++; streak++; sfx.good(); prog(found/keys.length); open=[]; lock=false;
            const r=c.getBoundingClientRect();
            burstAt(r.left+r.width/2, r.top+r.height/2, 22);
            toast(streak>1 ? (streak+' ברצף! 🔥') : ('מצאת את '+C[a.dataset.k].name+'! 💛'), streak>1?'pink':'mint');
            if(found===keys.length){ live=false; sfx.win(); burstAt(null,null,120); setTimeout(()=>done(true),700); } },430);
        } else {
          setTimeout(()=>{ a.classList.remove('up'); c.classList.remove('up'); open=[]; lock=false; streak=0; },780);
        }
      }
    };
    grid.appendChild(b);
  });
  const rem=deck.length%cols;
  if(rem) grid.children[deck.length-rem].style.gridColumnStart=Math.floor((cols-rem)/2)+1;
  (function tick(){
    if(!live) return;
    const left=cfg.dur-(performance.now()-t0)/1000;
    $('gtimer').textContent='⏱ '+Math.max(0,Math.ceil(left))+'  ·  '+found+'/'+keys.length+' זוגות';
    if(left<=0){ live=false; return done(found>=keys.length-1); }
    setTimeout(tick,250);
  })();
}

const GAMES = { sleep:gameSleep, find:gameFind, whack:gameWhack, whosaid:gameWhoSaid, memory:gameMemory };
</script>
<script>
/* ===================== FLOW ===================== */
function startLevel(n){
  S.lv=n; curLevel=LEVELS[n]; paint(); hud(true); spot(curLevel.spot);
  buildRoom(n); buildCast(n);
  $('cnum').textContent='שלב '+(n+1)+' מתוך 5';
  $('cscene').textContent=curLevel.scene;
  $('ctitle').textContent=curLevel.title;
  $('csub').innerHTML=curLevel.sub.replace(/\n/g,'<br>');
  show('card');
  $('cgo').onclick=()=>{ clearBubbles(); runDialogue(curLevel.intro, playGame); };
}
function playGame(){
  const g=curLevel.game;
  clearBubbles();
  $('gbar').querySelector('i').style.width='0%';
  $('gbox').innerHTML=''; $('gtitle').textContent=g.title; $('ghint').textContent=''; $('gtimer').textContent='';
  show('game');
  const card=document.createElement('div');
  card.className='howto';
  card.innerHTML='<div class="hi">'+(g.icon||'🎮')+'</div><h3>'+g.title+'</h3><p>'+(g.how||'')+'</p>'+
    (g.tips?'<div class="tips">'+g.tips.split('|').map(t=>'<span>'+t+'</span>').join('')+'</div>':'')+
    '<button class="btn" id="gstart">יאללה, מתחילים</button>';
  $('game').appendChild(card);
  $('gstart').onclick=()=>{
    ac(); card.remove();
    let over=false;
    const finish=res=>{ if(over) return; over=true; if(skip) skip.remove(); setTimeout(()=>result(res),420); };
    let skip=null;
    const skipT=setTimeout(()=>{
      if(over) return;
      skip=document.createElement('button');
      skip.className='btn ghost skipbtn'; skip.textContent='דלגי על המשחק ➔';
      skip.onclick=()=>finish(false);
      $('game').appendChild(skip);
    }, 22000);
    GAMES[g.type](g, res=>{ clearTimeout(skipT); finish(res); });
  };
}
function result(won){
  reactionsOff(); liveOff(); dlgStop();
  const d = won?curLevel.win:curLevel.lose;
  if(!won) S.scr=Math.max(0,S.scr-1);
  if(S.pat<=0){ S.pat=35; S.scr=Math.max(0,S.scr-1); }
  paint();
  $('ricon').textContent=d.i; $('rtitle').textContent=d.t; $('rtext').textContent=d.x;
  $('rgain').textContent='+'+d.fol.toLocaleString('en')+' עוקבים';
  $('rgain').classList.toggle('bad', !won);
  show('res');
  won?sfx.win():sfx.lose();
  if(won) burst(70);
  addFol(d.fol);
  const last = S.lv>=LEVELS.length-1;
  $('rretry').classList.toggle('hidden', won || S.scr<=0);
  $('rretry').onclick=()=>{ S.scr=Math.max(0,S.scr); S.fol=Math.max(0,S.fol-d.fol); paint(); playGame(); };
  $('rgo').textContent = last?'הסוף 🏆':'הלאה';
  $('rgo').onclick=()=>{
    clearBubbles();
    runDialogue(curLevel.outro, ()=> last?finale():startLevel(S.lv+1));
  };
}

/* ===================== FINALE ===================== */
function finale(){
  reactionsOff(); liveOff(); dlgStop(); hud(false); spot('50% 30%'); clearBubbles(); $('cast').innerHTML=''; buildRoom(4); burst(220);
  const total=S.fol.toLocaleString('he-IL');
  $('fin').innerHTML=`
    <div style="font-size:50px;margin-top:2px">🎉</div>
    <h2 class="bigmazal">מזל טוב תהל!</h2>
    <div class="cert">
      <div class="lbl">ת ע ו ד ה  ר ש מ י ת</div>
      <h2>כוכבת בת 10</h2>
      <div class="big">${C.tahel.name}</div>
      <div style="font-size:13.5px;line-height:1.6;color:#5B3A22">
        התחילה במקלחת. סיימה בהיכל מנורה.<br>
        <b style="color:#B4126A;font-family:var(--disp);font-size:20px">${total}</b> עוקבים<br>
        ו־${S.scr} סקוצ׳ים ששרדו את המסע.
      </div>
      <div style="height:1px;background:rgba(180,18,106,.2);margin:14px 0"></div>
      <div class="lbl" style="margin-bottom:6px">מ ה  ש ה מ ש פ ח ה  ר צ ת ה  ל ה ג י ד</div>
      ${WISHES.map(x=>`<div class="wish"><b>${C[x.w].name}:</b> ${x.t}</div>`).join('')}
      <div style="height:1px;background:rgba(180,18,106,.2);margin:14px 0"></div>
      <div style="font-family:var(--disp);font-size:19px;color:#B4126A">יום הולדת שמח 🎂</div>
    </div>
    <button class="btn" id="share">שתפי בוואטסאפ 💬</button>
    <button class="btn ghost" id="again" style="margin-bottom:24px">לשחק שוב</button>`;
  show('fin');
  sfx.win(); setTimeout(sfx.win, 700);
  $('share').onclick=()=>{
    const txt='🎤 '+C.tahel.name+' — הדרך לפסגה\n'+
      'הגעתי ל-'+total+' עוקבים והופעתי בהיכל מנורה 🏆\n'+
      'מזל טוב תהל!! 🎉';
    window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  };
  $('again').onclick=()=>{ S.fol=0;S.scr=3;S.pat=100; paint(); startLevel(0); };
}

/* ===================== atmosphere ===================== */
function makeDust(n){
  const box=$('dust'); if(!box) return; box.innerHTML='';
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='mote';
    const sz=2+Math.random()*5;
    d.style.width=d.style.height=sz.toFixed(1)+'px';
    d.style.left=(Math.random()*100).toFixed(1)+'%';
    d.style.top=(45+Math.random()*60).toFixed(1)+'%';
    d.style.setProperty('--dx',((Math.random()-.5)*70).toFixed(0)+'px');
    d.style.animationDuration=(9+Math.random()*11).toFixed(1)+'s';
    d.style.animationDelay=(-Math.random()*14).toFixed(1)+'s';
    box.appendChild(d);
  }
}

/* ===================== CONFETTI ===================== */
const cc=$('conf'), cx=cc.getContext&&cc.getContext('2d'); let parts=[];
function sizeConf(){ cc.width=innerWidth; cc.height=innerHeight; }
sizeConf(); addEventListener('resize',sizeConf);
function burst(n){ burstAt(null,null,n); }
function burstAt(bx,by,n){
  if(!cx) return;
  const cols=['#FF3D8B','#FFC93C','#3FE0BE','#FFF1E4','#C77DFF'];
  const spread=(bx==null)?cc.width*.6:46;
  for(let i=0;i<n;i++) parts.push({
    x:(bx==null?cc.width/2:bx)+(Math.random()-.5)*spread, y:(by==null?cc.height*.3:by),
    vx:(Math.random()-.5)*9, vy:-Math.random()*13-3,
    s:5+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.4,
    c:cols[(Math.random()*cols.length)|0], life:1
  });
  if(parts.length) loopConf();
}
let confRun=false;
function loopConf(){
  if(confRun) return; confRun=true;
  (function f(){
    cx.clearRect(0,0,cc.width,cc.height);
    parts=parts.filter(p=>p.life>0);
    parts.forEach(p=>{
      p.vy+=.42; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-= p.y>cc.height?.08:.004;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=Math.max(0,p.life);
      cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore();
    });
    if(parts.length) requestAnimationFrame(f); else { confRun=false; cx.clearRect(0,0,cc.width,cc.height); }
  })();
}

/* ===================== BOOT ===================== */
$('go').onclick=()=>{ ac(); sfx.good(); S.fol=0;S.scr=3;S.pat=100; startLevel(0); };
$('how').onclick=()=>{
  hud(false); spot('50% 55%'); buildRoom(1);
  $('cast').innerHTML='';
  const d=document.createElement('div');
  d.className='ch'; d.dataset.k='achot';
  d.style.cssText='--x:30%;--fy:16%;--s:1;--col:'+C.achot.col;
  d.dataset.s=1;
  d.innerHTML='<div class="fig">'+(C.achot.cut?'<div class="shadow"></div><img class="cut" src="'+C.achot.cut+'">':'<div class="head">'+C.achot.emoji+'</div><div class="torso"></div>')+'</div><div class="nametag">'+C.achot.name+'</div>';
  const t=document.createElement('div');
  t.className='ch'; t.dataset.k='tahel'; t.dataset.me='1'; t.dataset.s=1;
  t.style.cssText='--x:74%;--fy:15%;--s:1.03;--col:'+C.tahel.col;
  t.innerHTML='<div class="fig" style="--d:.5s">'+(C.tahel.cut?'<div class="shadow"></div><img class="cut" src="'+C.tahel.cut+'">':'<div class="head">'+C.tahel.emoji+'</div><div class="torso"></div>')+'</div><div class="nametag">'+C.tahel.name+'</div>';
  $('cast').appendChild(d); $('cast').appendChild(t);
  runDialogue([
    {w:'achot', t:'חמישה שלבים. בכל אחד שיחה קצרה, ואז משימה.'},
    {w:'achot', t:'למעלה: 🎀 זה הניסיונות שנשארו לך, הפס באמצע זו הסבלנות של ההורים, ומימין העוקבים.'},
    {w:'achot', t:'תשובות חצופות מצחיקות יותר, אבל שורפות סבלנות.'},
    {w:'tahel', t:'הבנתי. יאללה.'}
  ], ()=>{ clearBubbles(); $('cast').innerHTML=''; buildRoom(4); spot('50% 30%'); show('title'); });
};
makeDust(16); paint(); buildRoom(4);
/* rotating fake reviews on the title screen */
const REVIEWS=[
  ['★★★★★','"שיחקתי ולא הבנתי כלום. חמש כוכבים."','aba'],
  ['★★★★★','"הבת שלי גאון. גם המשחק."','ima'],
  ['★☆☆☆☆','"אני מופיע בו שתי שניות. סקנדל."','ach'],
  ['★★★★★','"צילמתי את המסך 40 פעם."','achot'],
  ['★★★★★','"הכי כיף שיש!!!" — תהל (לא מוטה)','tahel']
];
let revI=0;
(function rev(){
  const el=$('rev');
  if(el && $('title').classList.contains('on')){
    const r=REVIEWS[revI++%REVIEWS.length];
    el.innerHTML='<span><b style="color:var(--gold)">'+r[0]+'</b> '+r[1]+
      (r[2]!=='tahel'?' <b style="color:var(--pink)">— '+C[r[2]].name+'</b>':'')+'</span>';
  }
  setTimeout(rev,3400);
})(); spot('50% 30%');
</script>
