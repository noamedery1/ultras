<style>

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 50% 0%,#333,#0c0c0c 65%);
    color:var(--white);min-height:100vh;padding:16px;}
  .wrap{max-width:480px;margin:0 auto;}
  header{text-align:center;margin-bottom:16px;}
  header .logo{font-size:38px;}
  header h1{color:var(--yellow);font-size:26px;margin-top:2px;}
  header .sub{color:#bbb;font-size:13px;margin-top:2px;}
  .demo{background:#3a2f00;border:1px solid var(--yellow-dark);color:#ffe98a;font-size:12px;
    border-radius:10px;padding:8px 12px;text-align:center;margin-bottom:14px;}
  .picker{margin-bottom:16px;}
  .picker label{display:block;font-size:13px;color:#aaa;margin-bottom:6px;}
  select{width:100%;background:var(--gray);color:var(--white);border:2px solid var(--yellow);
    border-radius:14px;padding:14px;font-size:18px;font-weight:700;font-family:inherit;text-align:center;}
  .card{background:linear-gradient(135deg,#242424,#181818);border:2px solid #333;border-radius:18px;
    padding:20px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .who-name{font-size:30px;font-weight:800;color:var(--yellow);}
  .who-msgs{font-size:12px;color:#888;margin-bottom:10px;}
  .headline{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:14px;}
  .sketch{font-size:16px;line-height:1.65;background:#20200f;border-right:4px solid var(--yellow);
    border-radius:10px;padding:14px 16px;margin-bottom:10px;font-weight:600;}
  .jab{font-size:14px;line-height:1.5;background:var(--yellow);color:#000;border-radius:10px;
    padding:10px 14px;margin-bottom:8px;font-weight:800;}
  .jab2{font-size:13px;line-height:1.5;background:#2a2a2a;color:#ffe98a;border:1px solid #3a3520;
    border-radius:10px;padding:9px 13px;margin-bottom:14px;font-weight:700;}
  .stat1{font-size:13px;color:#bbb;background:var(--gray);border-radius:10px;padding:9px 12px;margin-bottom:14px;font-weight:700;}
  .tabs{display:flex;gap:8px;margin:4px 0 14px;}
  .tab{flex:1;background:var(--gray);border:1px solid #3a3a3a;border-radius:10px;padding:9px;
    font-size:14px;font-weight:800;font-family:inherit;color:#bbb;cursor:pointer;}
  .tab.active{background:var(--yellow);color:#000;border-color:var(--yellow);}
  .panel{animation:fade .2s ease;}
  .ev{background:#191919;border-right:3px solid #3a3520;border-radius:8px;padding:9px 12px;
    margin-bottom:6px;font-size:13px;line-height:1.5;color:#ddd;}
  .hidden{display:none!important;}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
  .badge{background:var(--yellow);color:#000;font-weight:800;font-size:13px;border-radius:999px;padding:6px 12px;}
  .sec-title{font-size:13px;color:#888;font-weight:700;margin:14px 0 8px;}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:14px;}
  .bar .lbl{flex:0 0 130px;font-weight:700;}
  .bar .track{flex:1;background:var(--gray);border-radius:8px;height:22px;overflow:hidden;position:relative;}
  .bar .fill{height:100%;border-radius:8px;min-width:2px;}
  .bar .pct{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:#eee;}
  .lines{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .lines li{background:var(--gray);border-radius:10px;padding:11px 13px;font-size:14px;line-height:1.45;}
  .quote{border-right:3px solid var(--yellow);background:#20200f;border-radius:8px;padding:10px 12px;
    margin-top:8px;font-size:14px;line-height:1.5;}
  .quote .qtop{font-size:11px;color:var(--yellow);font-weight:700;margin-bottom:3px;}
  .fp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--gray);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:14px;}
  .fp-row .fp-k{color:#999;font-weight:700;flex:0 0 auto;}
  .fp-row .fp-v{font-weight:700;text-align:left;}
  .chip2{display:inline-block;background:#3a3520;color:#ffe98a;border-radius:999px;
    padding:3px 10px;font-size:12px;font-weight:700;margin:2px 0 2px 4px;}
  .foot{text-align:center;font-size:12px;color:#666;margin-top:16px;}
</style>

const COLORS={football:'var(--c-football)',politics:'var(--c-politics)',humor:'var(--c-humor)'};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function colorFor(k){return COLORS[k]||'var(--c-extra)';}

function fpHtml(f){
  if(!f)return'';
  const rk=f.ranks||{};
  const rc=[];
  if(rk.curse&&rk.curse<=3)rc.push('🤬 קללות #'+rk.curse);
  if(rk.msgs&&rk.msgs<=3)rc.push('💬 הודעות #'+rk.msgs);
  if(rk.night&&rk.night<=3)rc.push('🦉 לילה #'+rk.night);
  if(rk.laugh&&rk.laugh<=3)rc.push('🤡 צחוקים #'+rk.laugh);
  const rows=[];
  if(f.obsession)rows.push(`<div class="fp-row"><span class="fp-k">🎯 אובססיה</span><span class="fp-v">${esc(f.obsession.name)} · ${f.obsession.count} אזכורים</span></div>`);
  if(f.sparring)rows.push(`<div class="fp-row"><span class="fp-k">🥊 מתכתש עם</span><span class="fp-v">${esc(f.sparring.name)}</span></div>`);
  rows.push(`<div class="fp-row"><span class="fp-k">🕐 שעת שיא</span><span class="fp-v">${esc(f.peak||'')} · ${f.nightPct||0}% אחרי חצות</span></div>`);
  const sig=(f.sigWords||[]).slice(0,4).map(w=>`<span class="chip2">${esc(w)}</span>`).join('');
  return `<div class="sec-title">🧬 טביעת אצבע</div>
    ${rc.length?`<div class="badges">${rc.map(c=>`<span class="badge">${c}</span>`).join('')}</div>`:''}
    ${rows.join('')}
    ${sig?`<div class="fp-row"><span class="fp-k">🗣️ מילים שחוזרות</span><span class="fp-v">${sig}</span></div>`:''}`;
}
function evHtml(e){
  if(!e)return'<div class="hint">אין נתונים.</div>';
  const blk=(title,arr)=>(arr&&arr.length)?`<div class="sec-title">${title}</div>`+arr.map(t=>`<div class="ev">״${esc(t)}״</div>`).join(''):'';
  let h='';
  if(e.obsName) h+=blk(`🎯 האזכורים של ${esc(e.obsName)} (${e.obsCount} סה״כ) — דוגמה`, e.obsMsgs);
  h+=blk('🤬 קללות — דוגמאות', e.curseMsgs);
  if(e.funny) h+=`<div class="sec-title">😂 ההודעה שהכי הצחיקה (${e.funnyL} צחקו אחריה)</div><div class="ev">״${esc(e.funny)}״</div>`;
  if(e.longest) h+=`<div class="sec-title">📜 ההודעה הכי ארוכה שלו</div><div class="ev">״${esc(e.longest)}״</div>`;
  h+=`<div class="hint">כל מספר בתיק מבוסס על ההודעות האמיתיות — זו הדגימה שמאחוריו.</div>`;
  return h;
}
function tab(btn){
  document.querySelectorAll('#card .tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#card .panel').forEach(pl=>pl.classList.toggle('hidden', pl.dataset.p!==btn.dataset.t));
}
function render(idx){
  const p=PROFILES.people[idx];if(!p)return;
  const f=p.fingerprint||{};
  const bars=p.topics.map(t=>`<div class="bar">
     <span class="lbl">${t.emoji} ${esc(t.label)}</span>
     <div class="track"><div class="fill" style="width:${Math.max(2,t.pct)}%;background:${colorFor(t.key)}"></div>
       <span class="pct">${t.pct}%</span></div></div>`).join('');
  const badges=(p.badges||[]).map(b=>`<span class="badge">${esc(b)}</span>`).join('');
  const seenQ=new Set();
  const quotes=(p.quotes||[]).filter(q=>{const k=(q.text||'').slice(0,25);if(seenQ.has(k))return false;seenQ.add(k);return true;})
    .map(q=>`<div class="quote"><div class="qtop">${q.emoji} ${esc(q.topic)}</div>״${esc(q.text)}״</div>`).join('');
  document.getElementById('card').innerHTML=
   `<div class="who-name">${esc(p.name)}</div>
    <div class="who-msgs">${p.msgs.toLocaleString('he-IL')} הודעות בחודשיים האחרונים</div>
    <div class="tabs">
      <button class="tab active" data-t="p1" onclick="tab(this)">🗂️ התיק</button>
      <button class="tab" data-t="p2" onclick="tab(this)">🧾 הוכחות</button>
    </div>
    <div class="panel" data-p="p1">
      ${p.sketch?`<div class="sketch">${esc(p.sketch)}</div>`:(p.headline?`<div class="headline">${esc(p.headline)}</div>`:'')}
      ${p.jab?`<div class="jab">😏 ${esc(p.jab)}</div>`:''}
      ${p.jab2?`<div class="jab2">🔪 ${esc(p.jab2)}</div>`:''}
      ${f.stat?`<div class="stat1">📊 ${esc(f.stat)}</div>`:''}
      ${badges?`<div class="badges">${badges}</div>`:''}
      <div class="sec-title">על מה הוא מדבר</div>${bars}
      ${fpHtml(f)}
      ${quotes?`<div class="sec-title">מוצג לראיה</div>${quotes}`:''}
    </div>
    <div class="panel hidden" data-p="p2">${evHtml(p.evidence)}</div>`;
}
(function init(){
  const sel=document.getElementById('who');
  sel.innerHTML=PROFILES.people.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('');
  sel.onchange=()=>render(+sel.value);
  const w=PROFILES.window||{};
  if(w.from&&w.from!=='—')document.getElementById('sub').textContent=`ביתר ירושלים • ${w.from}–${w.to}`;
  render(0);
})();
</script>
</body>
</html>
