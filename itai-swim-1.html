<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>איתי בן 11 — אליפות השחייה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--pool-deep:#064a72;--sun:#ffc53d;--ink:#06283d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:radial-gradient(900px 700px at 50% -10%, #7fd8f5 0%, #2c9fd0 45%, #0b5a86 100%);
    font-family:'Heebo',system-ui,Arial,sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:8px;
  }
  #frame{
    position:relative;width:min(100%,57vh);aspect-ratio:3/5;
    border-radius:20px;overflow:hidden;background:#0e86bd;
    box-shadow:0 24px 60px rgba(3,40,64,.45),0 0 0 5px rgba(255,255,255,.5),0 0 0 10px rgba(6,74,114,.3);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}

  #hud{position:absolute;inset:0;pointer-events:none;padding:12px 12px 0;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .chip{
    background:rgba(255,255,255,.9);border-radius:999px;padding:5px 12px;
    font-family:'Rubik',sans-serif;font-weight:800;font-size:clamp(11px,2.6vw,15px);
    box-shadow:0 3px 10px rgba(3,40,64,.25);display:flex;gap:6px;align-items:center;white-space:nowrap;
  }
  .chip small{font-weight:600;opacity:.6;font-size:.78em}
  #energyWrap{flex:1;height:16px;border-radius:999px;background:rgba(255,255,255,.82);padding:3px;box-shadow:0 3px 10px rgba(3,40,64,.25)}
  #energyBar{height:100%;border-radius:999px;width:100%;background:linear-gradient(90deg,#00c2a8,#7ee787);transition:width .12s linear,background .3s}
  #muteBtn{pointer-events:auto;cursor:pointer;border:0;font:inherit}

  /* ג'ויסטיק */
  #stick{
    position:absolute;bottom:2.2%;left:50%;transform:translateX(-50%);
    width:23%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.42),rgba(255,255,255,.16));
    border:3px solid rgba(255,255,255,.6);
    box-shadow:0 8px 20px rgba(3,40,64,.35),inset 0 2px 10px rgba(255,255,255,.4);
    touch-action:none;display:flex;align-items:center;justify-content:center;
  }
  #knob{
    width:46%;height:46%;border-radius:50%;
    background:linear-gradient(180deg,#3fc0ef,#0b6c9c);
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 5px 12px rgba(3,40,64,.4);
    transition:transform .05s linear;pointer-events:none;
  }
  #stickHint{
    position:absolute;bottom:.6%;left:50%;transform:translateX(-50%);
    font-size:clamp(9px,2vw,12px);font-weight:800;color:rgba(6,40,61,.55);pointer-events:none
  }

  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(4,45,70,.84),rgba(4,45,70,.94));padding:14px;text-align:center}
  .card{background:linear-gradient(175deg,#fff,#eaf6fb);border-radius:18px;padding:clamp(16px,4vw,26px);
    width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.35);border:3px solid rgba(14,134,189,.25)}
  h1{font-family:'Rubik',sans-serif;font-weight:900;font-size:clamp(20px,5.4vw,32px);margin:0 0 6px;color:var(--pool-deep);line-height:1.15}
  .sub{font-weight:600;color:#3d6b85;margin:0 0 14px;font-size:clamp(12px,3vw,15px)}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 14px;font-size:clamp(11px,2.7vw,13px)}
  .keys div{background:rgba(14,134,189,.09);border-radius:11px;padding:7px 8px;font-weight:700}
  .btn{border:0;cursor:pointer;font-family:'Rubik',sans-serif;font-weight:900;
    font-size:clamp(15px,3.6vw,20px);padding:13px 30px;border-radius:999px;color:#fff;
    background:linear-gradient(180deg,#12a2df,#0b6c9c);box-shadow:0 7px 0 #084f74,0 12px 22px rgba(0,0,0,.25);
    transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #084f74}
  .btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
  .avatar{width:74px;height:74px;border-radius:50%;object-fit:cover;border:4px solid var(--sun);
    box-shadow:0 6px 16px rgba(0,0,0,.25);margin-bottom:8px}
  .stats{display:flex;gap:8px;justify-content:center;margin:4px 0 16px;flex-wrap:wrap}
  .stat{background:rgba(14,134,189,.1);border-radius:13px;padding:8px 14px;min-width:92px}
  .stat b{display:block;font-family:'Rubik',sans-serif;font-size:clamp(18px,4.6vw,26px);color:var(--pool-deep)}
  .stat span{font-size:11px;font-weight:700;color:#4f7d95}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" width="600" height="1000" aria-label="משחק שחייה של איתי"></canvas>

  <div id="hud">
    <div class="row">
      <div class="chip">🏊 <span id="distTxt">0</span> <small>מ׳</small></div>
      <div class="chip">🏆 <span id="bestTxt">0</span></div>
      <div class="chip">💧 <span id="bottleTxt">0</span></div>
      <button id="muteBtn" class="chip" aria-label="השתקה">🔊</button>
    </div>
    <div class="row">
      <div class="chip" id="styleChip">🏊 חתירה</div>
      <div id="energyWrap"><div id="energyBar"></div></div>
    </div>
  </div>

  <div id="stick"><div id="knob"></div></div>
  <div id="stickHint">הזז ימינה ושמאלה</div>

  <div class="screen" id="menu">
    <div class="card">
      <img class="avatar" id="avatar" alt="איתי">
      <h1>איתי בן 11 🏊‍♂️<br>אליפות השחייה</h1>
      <p class="sub">שחה למעלה במסלול, התחמק מהשחיינים ואסוף בקבוקי מים. כל הבריכה מעודדת אותך!</p>
      <div class="keys">
        <div>🕹️ ג'ויסטיק למטה</div>
        <div>⬅️ ➡️ חיצים / A D</div>
        <div>💧 בקבוק = כוח + בוסט</div>
        <div>🚫 התנגשות = איבוד כוח</div>
      </div>
      <button class="btn" id="startBtn">מתחילים לשחות!</button>
    </div>
  </div>

  <div class="screen hidden" id="over">
    <div class="card">
      <img class="avatar" id="avatar2" alt="איתי">
      <h1 id="overTitle">איתי עייף! 😮‍💨</h1>
      <p class="sub" id="overSub">כל הכבוד על השחייה!</p>
      <div class="stats">
        <div class="stat"><b id="finalDist">0</b><span>מטרים</span></div>
        <div class="stat"><b id="finalBottles">0</b><span>בקבוקים</span></div>
        <div class="stat"><b id="finalBest">0</b><span>שיא</span></div>
      </div>
      <button class="btn" id="againBtn">עוד סיבוב!</button>
    </div>
  </div>
</div>

/* audio */
let ac=null;
function beep(f,d,ty,v){ if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=ty||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(v||.08,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}

function rr(x,y,w,h,r){ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}

function makeSpectator(y,deck){
  const kid=Math.random()<.45;
  return{y:y,deck:deck,x:deck===0?rand(40,66):W-rand(40,66),kid:kid,
    s:kid?rand(.6,.76):rand(.86,1.02),shirt:pick(SHIRTS),skin:pick(SKINS),hair:pick(HAIRS),
    ph:rand(0,7),wave:Math.random()<.75,
    prop:Math.random()<.3?pick(['flag','balloon','pom']):null,propColor:pick(SHIRTS)};
}
function initSpectators(){
  spectators=[];
  for(let d=0;d<2;d++){let y=rand(-60,10);while(y<H+120){spectators.push(makeSpectator(y,d));y+=rand(86,132);}}
}
function drawSpectator(sp){
  const s=sp.s,w=sp.wave?Math.sin(t*7+sp.ph):0;
  ctx.save();
  ctx.translate(sp.x,sp.y);
  ctx.rotate(sp.deck===0?Math.PI/2:-Math.PI/2);
  ctx.scale(s,s);
  ctx.fillStyle='rgba(90,70,45,.18)';ell(2,14,24,9);ctx.fill();
  ctx.strokeStyle=sp.skin;ctx.lineWidth=7;ctx.lineCap='round';
  [-1,1].forEach(side=>{const a=(side===-1?w:-w)*.5;
    ctx.beginPath();ctx.moveTo(side*15,-2);
    ctx.quadraticCurveTo(side*26,-14,side*(24+a*8),-26-Math.abs(w)*9);ctx.stroke();});
  ctx.fillStyle=sp.shirt;rr(-16,-8,32,30,11);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.08)';rr(-16,12,32,10,7);ctx.fill();

function drawArms(SKIN){

function drawBreastArms(SKIN){
  const p=(t*1.15)%1;
  [-1,1].forEach(side=>{
    let hx,hy,alpha;
    if(p<.35){const u=p/.35;hx=42-u*28;hy=side*(7+u*28);alpha=.6;}
    else if(p<.6){const u=(p-.35)/.25;hx=14-u*4;hy=side*(35-u*28);alpha=.6;}
    else{const u=(p-.6)/.4;hx=10+u*32;hy=side*7;alpha=.85;}
    ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=SKIN;ctx.lineWidth=12;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(14,side*12);
    ctx.quadraticCurveTo((14+hx)/2,side*25,hx,hy);ctx.stroke();ctx.restore();
  });
  if(p<.1){ctx.fillStyle='rgba(255,255,255,.5)';ell(42,0,20,23);ctx.fill();}

function drawLegs(SKIN){
  ctx.strokeStyle=SKIN;ctx.lineWidth=11;ctx.lineCap='round';
  if(styleIdx===0){
    const k=Math.sin(t*22);
    [-1,1].forEach((side,i)=>{ctx.beginPath();ctx.moveTo(-28,side*7);
      ctx.quadraticCurveTo(-46,side*9+k*(i?12:-12),-62,side*13+k*(i?20:-20));ctx.stroke();});
    ctx.fillStyle='rgba(255,255,255,'+(.35+.2*Math.abs(k))+')';ell(-66,0,20,17);ctx.fill();
  } else if(styleIdx===2){
    const k=Math.sin(t*13);
    [-1,1].forEach(side=>{ctx.beginPath();ctx.moveTo(-28,side*7);
      ctx.quadraticCurveTo(-46,side*8+k*10,-64,side*11+k*17);ctx.stroke();});
    ctx.fillStyle='rgba(255,255,255,'+(.4+.28*Math.abs(k))+')';ell(-68,k*7,23,19);ctx.fill();
  } else {
    const p=(t*1.15)%1;

    else{const u=(p-.75)/.25;sp=37-u*30;ext=.58+u*.42;}
    [-1,1].forEach(side=>{ctx.beginPath();ctx.moveTo(-26,side*7);
      ctx.quadraticCurveTo(-38,side*sp,-26-34*ext,side*sp*.75);ctx.stroke();});
    if(p>.72&&p<.92){ctx.fillStyle='rgba(255,255,255,.5)';ell(-58,0,23,25);ctx.fill();}
  }
}
function drawArm(ph,side,SKIN){
  const pull=ph<.55, u=pull?ph/.55:(ph-.55)/.45;
  let hx,hy,alpha,lw;
  if(pull){hx=34-u*62;hy=side*(15+Math.sin(u*Math.PI)*9);alpha=.5;lw=12;}
  else{hx=-28+u*64;hy=side*(23+Math.sin(u*Math.PI)*13);alpha=1;lw=13;}
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=SKIN;ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(14,side*12);
  ctx.quadraticCurveTo((14+hx)/2,side*26,hx,hy);ctx.stroke();ctx.restore();
  if(pull&&u<.18){ctx.fillStyle='rgba(255,255,255,.7)';circ(hx,hy,11-u*30);ctx.fill();}
}

const keys={};
addEventListener('keydown',e=>{keys[e.key]=true;
  if([' ','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  if(e.key===' '&&state!=='playing')startGame();});
addEventListener('keyup',e=>keys[e.key]=false);

let joy=0;
const stick=document.getElementById('stick'), knob=document.getElementById('knob');
let stickId=null;
function stickMove(e){
  const r=stick.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const max=r.width*.32;
  let dx=clamp(e.clientX-cx,-max,max), dy=clamp(e.clientY-cy,-max,max);
  joy=dx/max;
  knob.style.transform='translate('+dx+'px,'+(dy*.35)+'px)';
}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e);});
stick.addEventListener('pointermove',e=>{if(stickId===e.pointerId)stickMove(e);});
function stickEnd(e){if(stickId===e.pointerId){stickId=null;joy=0;knob.style.transform='translate(0,0)';}}
stick.addEventListener('pointerup',stickEnd);
stick.addEventListener('pointercancel',stickEnd);

let pointerX=null;
function ptrX(e){const r=cvs.getBoundingClientRect();return (e.clientX-r.left)*(W/r.width);}
cvs.addEventListener('pointerdown',e=>{pointerX=ptrX(e);cvs.setPointerCapture(e.pointerId);});
cvs.addEventListener('pointermove',e=>{if(pointerX!==null)pointerX=ptrX(e);});
cvs.addEventListener('pointerup',()=>pointerX=null);
cvs.addEventListener('pointercancel',()=>pointerX=null);

/* ---------- משחק ---------- */
function reset(){
  dist=0;energy=100;speed=210;boost=0;inv=0;shake=0;bottlesGot=0;
  obstacles=[];bottles=[];foam=[];confetti=[];cheers=[];
  itai={x:W/2,vx:0,tilt:0};
  scrollY=0;lastMile=0;spawnT=1.5;bottleT=3.5;cheerT=.8;banner=null;
  styleIdx=0;styleChip.textContent=STYLES[0].i+' '+STYLES[0].n;
  initSpectators();
}
function startGame(){
  reset();state='playing';
  menu.classList.add('hidden');over.classList.add('hidden');
  beep(660,.12,'triangle',.08);setTimeout(()=>beep(880,.16,'triangle',.08),120);
}
function endGame(){
  state='over';best=Math.max(best,Math.floor(dist));
  el('finalDist').textContent=Math.floor(dist);
  el('finalBottles').textContent=bottlesGot;
  el('finalBest').textContent=best;
  el('overTitle').textContent=(Math.floor(dist)>=best&&dist>0)?'שיא חדש! 🏆':'איתי עייף! 😮‍💨';
  el('overSub').textContent=dist>200?'הקהל קם על הרגליים בשבילך!':'עוד ניסיון אחד ושוברים את השיא.';
  over.classList.remove('hidden');
  beep(300,.3,'sawtooth',.06);
}

function update(dt){
  t+=dt;
  if(state!=='playing'){
    scrollY+=70*dt;
    cheerT-=dt;if(cheerT<=0){spawnCheer();cheerT=rand(1.4,2.6);}
    cheers.forEach(c=>c.life+=dt);cheers=cheers.filter(c=>c.life<c.max);
    spectators.forEach(s=>s.y+=70*dt);recycleSpectators();
    confetti.forEach(c=>{c.life+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;});
    confetti=confetti.filter(c=>c.life<c.max&&c.y<H+40);
    return;
  }
  let dir=joy;
  if(keys['ArrowLeft']||keys['a']||keys['A'])dir-=1;
  if(keys['ArrowRight']||keys['d']||keys['D'])dir+=1;
  if(pointerX!==null)dir=clamp((pointerX-itai.x)/55,-1,1);
  dir=clamp(dir,-1,1);
  itai.vx+=dir*2100*dt;
  itai.vx*=Math.pow(.0022,dt);
  itai.x+=itai.vx*dt;
  if(itai.x<SWIM_L){itai.x=SWIM_L;itai.vx*=-.25;}
  if(itai.x>SWIM_R){itai.x=SWIM_R;itai.vx*=-.25;}
  itai.tilt=clamp(itai.vx/1100,-.32,.32);

  const target=(210+Math.min(dist*.55,150))*(boost>0?1.75:1)*STYLE_SPD[styleIdx];
  speed+=(target-speed)*Math.min(1,dt*3);
  scrollY+=speed*dt;
  dist+=speed*dt/100;

  if(boost>0)boost-=dt;
  if(inv>0)inv-=dt;
  if(shake>0)shake-=dt;

  energy-=(2.6+(boost>0?2.6:0))*dt;
  if(energy<=0){energy=0;endGame();return;}

  if(Math.floor(dist/50)>lastMile){
    lastMile=Math.floor(dist/50);const m=lastMile*50;
    const ns=Math.floor(dist/200)%3;
    if(ns!==styleIdx){
      styleIdx=ns;const st=STYLES[styleIdx];
      styleChip.textContent=st.i+' '+st.n;
      banner={text:'סגנון '+st.n+'! '+st.i,life:0};
      addConfetti(50);
      beep(520,.1,'triangle',.07);setTimeout(()=>beep(820,.16,'triangle',.07),120);
    }else{
      banner={text:m===550?'מזל טוב איתי! גיל 11 🎂':(m+' מטר! 🔥'),life:0};
      addConfetti(m===550?90:35);beep(880,.12,'triangle',.07);
    }
  }

  spawnT-=dt;if(spawnT<=0){spawnObstacle();spawnT=rand(.85,1.6)*clamp(1-dist/900,.5,1);}
  bottleT-=dt;if(bottleT<=0){spawnBottle();bottleT=rand(4,7.5);}
  cheerT-=dt;if(cheerT<=0){spawnCheer();cheerT=rand(1.2,2.4);}

  obstacles.forEach(o=>{
    o.y+=(speed+o.rel)*dt;
    o.x+=Math.sin(t*1.1+o.ph)*o.drift*dt;
    o.x=clamp(o.x,SWIM_L-6,SWIM_R+6);
    if(inv<=0){
      const dx=o.x-itai.x,dy=o.y-ITAI_Y;
      if(dx*dx+dy*dy<(o.r+28)*(o.r+28)){
        energy-=22;inv=1.3;shake=.35;boost=0;speed*=.55;
        addFoam(itai.x,ITAI_Y-20,16,1.4);beep(180,.22,'square',.07);
        const vis=spectators.filter(s=>s.y>120&&s.y<POOL_B-80);
        if(vis.length&&cheers.length<2)cheers.push({sp:pick(vis),text:pick(['אוי! 😬','זהירות איתי!','תמשיך תמשיך!']),life:0,max:2});
      }
    }
  });
  obstacles=obstacles.filter(o=>o.y<H+120);

  bottles.forEach(b=>{
    b.y+=speed*dt;
    const dx=b.x-itai.x,dy=b.y-ITAI_Y;
    if(dx*dx+dy*dy<44*44){
      b.dead=true;bottlesGot++;energy=Math.min(100,energy+32);boost=2.6;
      addFoam(b.x,b.y,14,.8);addConfetti(12);
      beep(980,.1,'sine',.07);setTimeout(()=>beep(1320,.12,'sine',.06),90);
    }
  });
  bottles=bottles.filter(b=>!b.dead&&b.y<H+60);

  addFoam(itai.x,ITAI_Y+60,boost>0?3:2,boost>0?1.3:1);
  foam.forEach(f=>{f.life+=dt;f.x+=f.vx*dt;f.y+=(f.vy+speed*.35)*dt;});
  foam=foam.filter(f=>f.life<f.max&&f.y<POOL_B+40);

  confetti.forEach(c=>{c.life+=dt;c.x+=c.vx*dt;c.y+=(c.vy+speed*.25)*dt;c.rot+=c.vr*dt;});
  confetti=confetti.filter(c=>c.life<c.max&&c.y<H+40);

  cheers.forEach(c=>c.life+=dt);cheers=cheers.filter(c=>c.life<c.max);

  spectators.forEach(s=>s.y+=speed*dt*.9);recycleSpectators();

  if(banner){banner.life+=dt;if(banner.life>2.2)banner=null;}

  distTxt.textContent=Math.floor(dist);
  bestTxt.textContent=Math.max(best,Math.floor(dist));
  bottleTxt.textContent=bottlesGot;
  energyBar.style.width=energy+'%';
  energyBar.style.background=energy>50?'linear-gradient(90deg,#00c2a8,#7ee787)'
    :energy>25?'linear-gradient(90deg,#ffb03a,#ffd76e)':'linear-gradient(90deg,#e63946,#ff8a7a)';
}
function recycleSpectators(){
  for(const s of spectators){
    if(s.y>H+130){
      let minY=1e9;
      for(const o of spectators) if(o.deck===s.deck&&o.y<minY) minY=o.y;
      Object.assign(s,makeSpectator(minY-rand(86,132),s.deck));
    }
  }
}

function render(){
  ctx.save();
  if(shake>0)ctx.translate(rand(-6,6)*shake*3,rand(-6,6)*shake*3);

  drawWater();
  drawRopes();
  bottles.forEach(drawBottle);
  obstacles.forEach(drawSwimmerBody);
  foam.forEach(f=>{const a=1-f.life/f.max;
    ctx.fillStyle='rgba(255,255,255,'+(a*.55)+')';circ(f.x,f.y,f.r*(.6+a*.6));ctx.fill();});
  if(state!=='menu')drawItai();

  drawDecks();
  spectators.forEach(drawSpectator);
  cheers.forEach(drawCheer);

  confetti.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
    ctx.globalAlpha=clamp(1-c.life/c.max,0,1);ctx.fillStyle=c.c;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();});

  if(banner){
    const k=banner.life/2.2,pop=k<.15?.6+.4*(k/.15):1;
    ctx.save();ctx.globalAlpha=clamp(k>.75?(1-k)/.25:1,0,1);
    ctx.translate(W/2,300);ctx.scale(pop,pop);
    ctx.font='900 34px Rubik, Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=8;ctx.strokeStyle='rgba(6,40,61,.65)';ctx.strokeText(banner.text,0,0);
    ctx.fillStyle='#ffc53d';ctx.fillText(banner.text,0,0);ctx.restore();
  }
  if(boost>0){
    ctx.save();ctx.globalAlpha=.22+.14*Math.sin(t*14);
    const g=ctx.createLinearGradient(0,POOL_B,0,POOL_B*.35);
    g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(WATER_L,POOL_B*.35,WATER_R-WATER_L,POOL_B*.65);ctx.restore();
  }
  ctx.restore();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render();requestAnimationFrame(loop);
}

el('startBtn').addEventListener('click',startGame);
el('againBtn').addEventListener('click',startGame);
el('muteBtn').addEventListener('click',()=>{muted=!muted;el('muteBtn').textContent=muted?'🔇':'🔊';});

makeTerrazzo();reset();requestAnimationFrame(loop);
})();
</script>
</body>
