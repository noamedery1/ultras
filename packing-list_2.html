<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>רשימת ציוד · פאפוס 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F3239; --sea:#17646F; --surf:#8ED2CE; --limestone:#F1F3EE;
  --paper:#FFFFFF; --sun:#E5A020; --olive:#6E8552; --line:#D8DED8; --muted:#6C7B7A; --danger:#C0553F;
  --r:14px; --shadow:0 1px 0 rgba(15,50,57,.06), 0 8px 24px -18px rgba(15,50,57,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--limestone); color:var(--ink);
  font-family:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:0 0 calc(84px + env(safe-area-inset-bottom));
}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 0}

/* ---------- תווית מזוודה ---------- */
.tag{position:relative;overflow:hidden;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.tag__water{position:absolute;inset:auto 0 0 0;height:0%;background:linear-gradient(180deg,var(--surf) 0%,var(--sea) 130%);transition:height .7s cubic-bezier(.22,.8,.28,1)}
.tag__wave{position:absolute;left:0;right:0;top:-13px;width:100%;height:14px;display:block}
.tag__wave path{fill:var(--surf)}
@media (prefers-reduced-motion:no-preference){.tag__wave{animation:drift 9s linear infinite}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tag__body{position:relative;z-index:2;padding:18px 20px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.tag__where{flex:1 1 200px;min-width:0}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
h1{font-family:"Suez One",serif;font-size:clamp(23px,6vw,34px);line-height:1.05;margin:0;letter-spacing:-.01em}
.tag__sub{margin:6px 0 0;font-size:13px;color:var(--muted)}
.tag__sub b{color:var(--ink);font-weight:600}
.tag__pct{text-align:center;flex:0 0 auto}
.pct{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:34px;line-height:1;letter-spacing:-.03em}
.pct span{font-size:16px;opacity:.5}
.pct__label{font-size:11px;color:var(--muted);margin-top:2px}

/* ---------- שורת מצב ---------- */
.top{display:flex;align-items:center;gap:8px;margin:12px 2px 2px}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:6px 2px;cursor:pointer;border:0;background:none;font-family:inherit}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot--ok{background:var(--olive)} .dot--busy{background:var(--sun);animation:pulse 1s infinite} .dot--off{background:var(--danger)}
@keyframes pulse{50%{opacity:.25}}
.grow{flex:1}
.hidepacked{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.hidepacked input{accent-color:var(--sea);width:16px;height:16px}

/* ---------- טאבים — נפרסים בשורות, בלי גלילה ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 4px}
.tab{
  flex:1 1 128px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;
  font:inherit;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);text-align:center
}
.tab small{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--muted);background:var(--limestone);border-radius:999px;padding:2px 7px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab[aria-selected="true"] small{background:rgba(255,255,255,.18);color:#fff}
.tab.done[aria-selected="false"]{color:var(--olive);border-color:var(--olive)}
.tab.done[aria-selected="false"] small{color:var(--olive)}
.tab--add{flex:0 1 128px;border-style:dashed;color:var(--muted);background:transparent;box-shadow:none;font-weight:700}
.tab--add:hover{border-color:var(--sea);color:var(--sea)}

/* ---------- לוח פריטים ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 14px 6px;margin-top:2px}
.panel__head{display:flex;align-items:center;gap:10px;padding:12px 4px 8px;border-bottom:2px solid var(--ink)}
.panel__head h2{font-family:"Suez One",serif;font-size:18px;margin:0;flex:1 1 auto;min-width:0}
.cat-del{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px;display:flex;align-items:center;gap:4px}
.cat-del:hover{color:var(--danger)}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row--done .row__name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--surf);text-decoration-thickness:2px}
.check{position:relative;flex:0 0 auto;width:26px;height:26px;margin-top:0}
.check input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.check span{display:block;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;background:var(--paper);transition:.15s}
.check span::after{content:"";position:absolute;top:7px;inset-inline-start:9px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:.15s}
.check input:checked + span{background:var(--olive);border-color:var(--olive)}
.check input:checked + span::after{transform:rotate(45deg) scale(1)}
.check input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}
.row__main{flex:1 1 auto;min-width:0}
.row__name{font-weight:600;word-break:break-word}
.row__note{font-size:13px;color:var(--muted);margin-top:1px}
.row__meta{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-top:2px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--limestone);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip--qty{font-family:"IBM Plex Mono",monospace}
.del{border:0;background:none;cursor:pointer;color:var(--line);font-size:22px;line-height:1;padding:2px 6px}
.row:hover .del,.del:focus{color:var(--danger)}
.cat-empty{padding:16px 4px;color:var(--muted);font-size:14px}

/* ---------- שורת הוספה מהירה ---------- */
.add{display:flex;align-items:center;gap:10px;padding:12px 4px 8px;border-top:2px solid var(--ink);margin-top:2px}
.add__plus{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:16px;line-height:1}
.add input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:4px 0}
.add input::placeholder{color:var(--muted)}
.add button{border:0;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;cursor:pointer;flex:0 0 auto}
.add button:hover{background:var(--sea)}
.add button:disabled{opacity:.4;cursor:default}

/* ---------- דיאלוגים ---------- */
dialog{border:0;border-radius:var(--r);padding:0;max-width:440px;width:calc(100% - 32px);box-shadow:0 30px 70px -30px rgba(15,50,57,.6);color:var(--ink)}
dialog::backdrop{background:rgba(15,50,57,.35)}
.dlg{padding:22px}
.dlg h2{font-family:"Suez One",serif;font-size:20px;margin:0 0 12px}
.dlg p{font-size:14px;color:var(--muted);margin:0}
.dlg label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
.dlg input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--limestone);color:var(--ink)}
.dlg input:focus{outline:2px solid var(--sea);outline-offset:1px}
.dlg__actions{display:flex;gap:8px;justify-content:flex-start;margin-top:20px}
.dlg ol{margin:8px 0 0;padding-inline-start:20px;font-size:14px;line-height:1.7;color:var(--muted)}
.dlg ol b{color:var(--ink)} .dlg code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--limestone);padding:1px 5px;border-radius:5px}

/* ---------- פס תחתון ---------- */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:50;background:rgba(241,243,238,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.dock__in{max-width:820px;margin:0 auto;padding:10px 14px;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:10px 14px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--sea);color:var(--sea)}
.btn--solid{background:var(--ink);color:#fff;border-color:var(--ink)} .btn--solid:hover{background:var(--sea);border-color:var(--sea);color:#fff}
.btn--ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}

@media(max-width:520px){
  .tag__body{padding:16px}
  .row__meta .chip--who{display:none}
  .tab{flex:1 1 44%}          /* שני טאבים בשורה בנייד */
  .tab--add{flex:1 1 44%}
}
</style>
</head>
<body>

<div class="wrap">

  <header class="tag">
    <div class="tag__water" id="water">
      <svg class="tag__wave" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 14 V7 Q12.5 0 25 7 T50 7 T75 7 T100 7 T125 7 T150 7 T175 7 T200 7 V14 Z"/>

      </div>
      <div class="tag__pct">
        <div class="pct"><span id="packed">0</span>/<span id="total">0</span></div>
        <div class="pct__label">נארזו</div>
      </div>
    </div>
  </header>

  <div class="top">
    <button class="sync" id="syncBtn" title="מצב סנכרון">
      <span class="dot" id="dot"></span><span id="syncText">לא מחובר</span>
    </button>
    <span class="grow"></span>
    <label class="hidepacked"><input type="checkbox" id="hidePacked">הסתר שנארזו</label>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="קטגוריות"></nav>

  <main class="panel">
    <div class="panel__head">
      <h2 id="catName">—</h2>
      <button class="cat-del" id="catDel" title="מחיקת קטגוריה">מחק קטגוריה</button>
    </div>
    <ul class="list" id="list"></ul>
    <div class="add">
      <span class="add__plus">+</span>
      <input id="quick" type="text" maxlength="60" autocomplete="off" placeholder="הוסף פריט…">
      <button id="quickBtn" disabled>הוסף</button>
    </div>
  </main>
</div>

<div class="dock"><div class="dock__in">
  <button class="btn" id="csvBtn">ייצוא לאקסל</button>
  <span class="grow"></span>
  <button class="btn btn--ghost" id="meBtn">מי אני?</button>
</div></div>

<!-- דיאלוג קטגוריה -->
<dialog id="catDlg"><form method="dialog" class="dlg">
  <h2>קטגוריה חדשה</h2>
  <p>שם הטאב שיתווסף לרשימה של כולם.</p>
  <label for="f-cat">שם הקטגוריה</label>
  <input id="f-cat" maxlength="30" autocomplete="off" placeholder="למשל: ציוד צלילה">
  <div class="dlg__actions">
    <button class="btn btn--solid" value="save">הוספה</button>
    <button class="btn" value="cancel" formnovalidate>ביטול</button>
  </div>
</form></dialog>

<!-- דיאלוג שם -->
<dialog id="meDlg"><form method="dialog" class="dlg">
  <h2>איך קוראים לך?</h2>
  <p>השם יופיע ליד פריטים שסימנת, כדי שכולם ידעו מי ארז מה.</p>
  <label for="f-me">שם</label>
  <input id="f-me" maxlength="20" autocomplete="off">
  <div class="dlg__actions">
    <button class="btn btn--solid" value="save">שמירה</button>
    <button class="btn" value="cancel" formnovalidate>ביטול</button>
  </div>
</form></dialog>

<!-- דיאלוג סנכרון -->
<dialog id="syncDlg"><form method="dialog" class="dlg">
  <h2>מצב סנכרון</h2>
  <p id="syncInfo"></p>
  <label for="f-url">כתובת Web App</label>
  <input id="f-url" type="url" autocomplete="off">
  <div class="dlg__actions">
    <button class="btn btn--solid" value="save">עדכון</button>
    <button class="btn" value="cancel" formnovalidate>סגירה</button>
  </div>
</form></dialog>

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cats = () => [...new Set([...categories, ...items.map(i=>i.category)])].filter(c=>c && c!=="__meta__");

function seedLocal(){ items = SEED.map(([category,name,qty,note])=>({id:uid(),category,name,qty,note,packed:false,who:"",by:"",updatedAt:0})); }

/* ===== מטמון מקומי — טעינה מיידית ===== */
const CACHE_KEY = "paphos-list-v1";
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({items,categories,me})); }catch(e){} }
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY); if(!raw) return false;
    const c = JSON.parse(raw);
    if(Array.isArray(c.items) && c.items.length){
      items = c.items;
      if(Array.isArray(c.categories) && c.categories.length) categories = c.categories;
      if(c.me){ me = c.me; }
      return true;
    }
  }catch(e){}
  return false;
}

/* ===== סנכרון ===== */
function setSync(s,t){ $("#dot").className="dot "+s; $("#syncText").textContent=t; }
async function call(action,payload){
  if(!api) throw new Error("no-api");
  const res = await fetch(api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,payload})});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data = await res.json(); if(data.error) throw new Error(data.error); return data;
}
function applyMeta(){
  const m = items.find(i=>i.id===META_ID);
  items = items.filter(i=>i.id!==META_ID);
  if(m && m.note){ try{ const a=JSON.parse(m.note); if(Array.isArray(a)&&a.length) categories=a; }catch(e){} }
  else { categories=[...new Set([...CATS, ...items.map(i=>i.category)])]; saveMeta(); }
}
function metaRow(){ return {id:META_ID,category:"__meta__",name:"‹שורת מערכת — אל תמחקו›",qty:"",note:JSON.stringify(categories),packed:false,who:"",by:"",updatedAt:Date.now()}; }
function saveMeta(){ push("update", metaRow()); }

async function pull(){
  if(!api||syncing) return;
  syncing=true; setSync("dot--busy","מסנכרן…");
  try{
    let data = await call("list");
    if(!data.items.length) data = await call("seed",{rows:SEED});
    items = data.items; applyMeta(); render(); setSync("dot--ok","מסונכרן");
  }catch(e){ setSync("dot--off","הסנכרון נכשל"); console.error(e); }
  finally{ syncing=false; }
}
async function push(action,payload){
  if(!api) return;
  setSync("dot--busy","שומר…");
  try{ await call(action,payload); setSync("dot--ok","מסונכרן"); }
  catch(e){ setSync("dot--off","לא נשמר — נסו שוב"); console.error(e); }
}

/* ===== פעולות פריטים ===== */
function toggle(id,packed){ const it=items.find(i=>i.id===id); if(!it) return; it.packed=packed; it.by=packed?me:""; it.updatedAt=Date.now(); render(); push("update",it); }
function addItem(name){ const it={id:uid(),category:active,name,qty:"",note:"",who:"",packed:false,by:"",updatedAt:Date.now()}; items.push(it); render(); push("update",it); }
function removeItem(id){ items=items.filter(i=>i.id!==id); render(); push("delete",{id}); }

/* ===== פעולות קטגוריות ===== */
function addCategory(name){
  name=name.trim(); if(!name) return;
  if(cats().includes(name)){ active=name; render(); return; }
  categories=[...cats(), name]; active=name; render(); saveMeta();
}
function deleteCategory(name){
  const victims=items.filter(i=>i.category===name);
  const msg=victims.length ? `למחוק את הקטגוריה «${name}» ו-${victims.length} פריטים שבתוכה?` : `למחוק את הקטגוריה «${name}»?`;
  if(!confirm(msg)) return;
  categories=cats().filter(c=>c!==name);
  items=items.filter(i=>i.category!==name);
  active=cats()[0]||""; render();
  saveMeta(); victims.forEach(v=>push("delete",{id:v.id}));
}

function exportCSV(){
  const head=["קטגוריה","פריט","כמות","הערה","נארז","באחריות","מי סימן"];
  const rows=items.map(i=>[i.category,i.name,i.qty,i.note,i.packed?"כן":"לא",i.who,i.by]);
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv="\uFEFF"+[head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=Object.assign(document.createElement("a"),{href:url,download:"ציוד-פאפוס.csv"}); a.click(); URL.revokeObjectURL(url);
}

/* ===== תצוגה ===== */
function renderTabs(){
  const nav=$("#tabs"); nav.innerHTML="";
  for(const c of cats()){
    const all=items.filter(i=>i.category===c), done=all.filter(i=>i.packed).length;
    const b=document.createElement("button");
    b.className="tab"+(all.length&&done===all.length?" done":"");
    b.setAttribute("role","tab"); b.setAttribute("aria-selected", c===active);
    b.innerHTML=`<span>${esc(c)}</span><small>${done}/${all.length}</small>`;
    b.addEventListener("click",()=>{ active=c; render(); });
    nav.appendChild(b);
  }
  const add=document.createElement("button");
  add.className="tab tab--add"; add.textContent="+ קטגוריה";
  add.addEventListener("click",()=>{ $("#f-cat").value=""; $("#catDlg").showModal(); });
  nav.appendChild(add);
}
function renderList(){
  $("#catName").textContent = active || "—";
  $("#catDel").style.display = active ? "flex" : "none";
  const ul=$("#list"); ul.innerHTML="";
  let list=items.filter(i=>i.category===active);
  if(hidePacked) list=list.filter(i=>!i.packed);
  if(!list.length){
    ul.innerHTML=`<li class="cat-empty">${hidePacked?"הכל בקטגוריה הזו כבר ארוז 🎉":"אין כאן פריטים — הוסיפו למטה."}</li>`; return;
  }
  for(const i of list){
    const li=document.createElement("li");
    li.className="row"+(i.packed?" row--done":"");
    li.innerHTML=`
      <label class="check"><input type="checkbox" ${i.packed?"checked":""} aria-label="${esc(i.name)}"><span></span></label>
      <div class="row__main">
        <div class="row__name">${esc(i.name)}</div>
        ${i.note||(i.packed&&i.by)?`<div class="row__note">${esc(i.note)}${i.note&&i.packed&&i.by?" · ":""}${i.packed&&i.by?'סומן ע"י '+esc(i.by):""}</div>`:""}
      </div>
      <div class="row__meta">
        ${i.qty?`<span class="chip chip--qty">${esc(i.qty)}</span>`:""}
        ${i.who?`<span class="chip chip--who">${esc(i.who)}</span>`:""}
        <button class="del" title="מחיקה" aria-label="מחיקת ${esc(i.name)}">×</button>
      </div>`;
    li.querySelector("input").addEventListener("change",e=>toggle(i.id,e.target.checked));
    li.querySelector(".del").addEventListener("click",()=>{ if(confirm(`למחוק את «${i.name}»?`)) removeItem(i.id); });
    ul.appendChild(li);
  }
}
function render(){
  if(!cats().includes(active)) active=cats()[0]||"";
  const total=items.length, packed=items.filter(i=>i.packed).length, pct=total?Math.round(packed/total*100):0;
  $("#packed").textContent=packed; $("#total").textContent=total; $("#water").style.height=pct+"%";
  $("#quick").placeholder=`הוסף פריט ל“${active}”…`;
  renderTabs(); renderList(); saveCache();
}

/* ===== חיווט ===== */
const quick=$("#quick"), quickBtn=$("#quickBtn");
function doAdd(){ const v=quick.value.trim(); if(!v||!active) return; addItem(v); quick.value=""; quickBtn.disabled=true; quick.focus(); }
quick.addEventListener("input",()=>quickBtn.disabled=!quick.value.trim());
quick.addEventListener("keydown",e=>{ if(e.key==="Enter") doAdd(); });
quickBtn.addEventListener("click",doAdd);

$("#catDel").addEventListener("click",()=>{ if(active) deleteCategory(active); });
$("#catDlg").addEventListener("close",()=>{ if($("#catDlg").returnValue==="save") addCategory($("#f-cat").value); });

$("#hidePacked").addEventListener("change",e=>{ hidePacked=e.target.checked; render(); });
$("#csvBtn").addEventListener("click",exportCSV);

$("#meBtn").addEventListener("click",()=>{ $("#f-me").value=me; $("#meDlg").showModal(); });
$("#meDlg").addEventListener("close",()=>{ if($("#meDlg").returnValue==="save"){ me=$("#f-me").value.trim(); $("#meBtn").textContent=me||"מי אני?"; } });

$("#syncBtn").addEventListener("click",()=>{
  $("#f-url").value=api;
  $("#syncInfo").textContent = api ? "מחובר קבוע לגיליון. אפשר לעדכן כתובת רק אם פרסתם Web App חדש." : "לא מחובר — הדביקו כתובת Web App.";
  $("#syncDlg").showModal();
});
$("#syncDlg").addEventListener("close",()=>{ if($("#syncDlg").returnValue==="save"){ api=$("#f-url").value.trim(); if(api) pull(); } });

(function(){ const d=Math.ceil((new Date(DEPART)-new Date())/86400000);
  $("#days").textContent = d>1?`עוד ${d} ימים`:d===1?"מחר!":d===0?"היום!":"בדרך"; })();

// ציור מיידי: מטמון קודם, אחרת רשימה התחלתית — בלי לחכות לרשת
if(!loadCache()) seedLocal();
if(me) $("#meBtn").textContent = me;
render();

if(api){ setSync("dot--busy","מסתנכרן…"); pull(); setInterval(pull,POLL_MS); }
else{ setSync("dot--off","לא מחובר"); }
</script>
</body>
</html>
